[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interfood-financial-intelligence"
version = "1.0.0"
description = "INTERFOOD FINANCIAL INTELLIGENCE - Case de Controladoria e Ciência de Dados (DADOS SINTÉTICOS)"
authors = [{name = "Interfood Analytics Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "faker>=22.0.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "openpyxl>=3.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
